name: Release binaries

# Builds the standalone binaries that the Homebrew formula installs. Triggered by a version
# tag; see docs/adr/0008-homebrew-distribution.md for why this ships a frozen binary rather
# than a Homebrew Python formula.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (dry run — does not publish)"
        required: true

permissions:
  contents: read

env:
  # `skillspector` is not on PyPI and upstream publishes no tags or releases, so the only way
  # to pin it is a commit SHA. This is the newest commit where upstream pyproject.toml declares
  # version 2.4.4 — the exact version this package pins in its dependencies.
  # Verify before bumping: the nine upstream symbols imported by src/skillspector_quality/
  # (resolve_input, build_context, meta_analyzer, report, ANALYZER_NODES, ANALYZER_NODE_IDS,
  # SkillspectorState, chat_completion, is_llm_available) must all still exist.
  SKILLSPECTOR_REPO: NVIDIA/skillspector
  SKILLSPECTOR_SHA: fd25398d7aa99353d86237b9c260759351f0e644
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile, so each target needs its own native runner.
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x86_64
            runner: macos-13
          - target: linux-x86_64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out pinned skillspector
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.SKILLSPECTOR_REPO }}
          ref: ${{ env.SKILLSPECTOR_SHA }}
          path: .skillspector-src
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # Order matters. Installing the real skillspector FIRST satisfies this package's
          # `skillspector==2.4.4` pin, so the next install does not try (and fail) to reach
          # PyPI for it. pip is used deliberately instead of uv: [tool.uv.sources] redirects
          # skillspector to the CI stub, which must never end up in a release binary.
          python -m pip install ./.skillspector-src
          python -m pip install ".[code]"
          python -m pip install pyinstaller==6.21.0

      - name: Verify the real upstream is installed, not the stub
        run: |
          set -euxo pipefail
          python - <<'PY'
          import pathlib, skillspector
          version = getattr(skillspector, "__version__", "")
          assert version == "2.4.4", f"unexpected skillspector version: {version!r}"
          root = pathlib.Path(skillspector.__file__).parent
          # The CI stub carries nodes/analyzers.py (a module); real upstream ships
          # nodes/analyzers/ (a package). Guards against shipping a stubbed binary.
          assert (root / "nodes" / "analyzers" / "__init__.py").is_file(), (
              "stub skillspector detected — refusing to build a release binary"
          )
          print("verified real skillspector", version)
          PY

      - name: Build binary
        working-directory: packaging/pyinstaller
        run: pyinstaller skillspector-quality.spec --clean --noconfirm

      - name: Smoke-test binary
        run: |
          set -euxo pipefail
          BIN=packaging/pyinstaller/dist/skillspector-quality
          "$BIN" --help
          # Scores a known fixture and asserts the frozen build agrees with the source build.
          # Catches a bundle that starts but has lost a dynamically imported dependency.
          "$BIN" scan tests/fixtures/calib-strong --no-llm --format json > /tmp/out.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/out.json"))["quality_assessment"]
          assert data["score"] == 82, f"frozen binary scored {data['score']}, expected 82"
          print("smoke test passed: score", data["score"])
          PY

      - name: Package
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="skillspector-quality-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp packaging/pyinstaller/dist/skillspector-quality "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          shasum -a 256 "dist/${NAME}.tar.gz" | tee "dist/${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # required to create the release and upload assets
      id-token: write # required for Sigstore keyless signing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # OpenSSF Best Practices `release_notes` requires a human-readable summary of major
      # changes; an auto-generated commit or PR list does not qualify. The notes therefore
      # come from the CHANGELOG.md section matching the tag, and a missing section fails the
      # release rather than silently degrading to a commit dump.
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY' > release-notes.md
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Section runs from its own "## [x.y.z]" heading to the next "## " heading.
          pattern = rf"^## \[{re.escape(version)}\].*?$\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if match is None:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section; add one before tagging.")
          body = match.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for {version} is empty.")
          print(body)
          PY
          echo "--- release notes ---"
          cat release-notes.md

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: cosign exchanges this job's OIDC token for a short-lived certificate
      # binding the signature to the workflow identity (repo + ref + workflow), and records it
      # in the public Rekor transparency log. Nothing secret is stored, so there is no signing
      # key to leak or to lose along with a maintainer — see docs/assurance-case.md (C6).
      - name: Sign artifacts with Sigstore
        run: |
          set -euxo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          # Signing SHA256SUMS covers every tarball transitively: verify the signature on the
          # manifest, then check each digest against it.
          for f in dist/SHA256SUMS dist/*.tar.gz; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore.json" \
              "$f"
          done
          ls -l dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Using the preinstalled gh CLI rather than a third-party release action keeps one
          # more unpinned dependency out of the supply chain.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/SHA256SUMS dist/*.sigstore.json
