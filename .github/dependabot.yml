version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Hash-pinned fuzzing build inputs. Without this entry the digests in
  # .clusterfuzzlite/requirements.txt would never be refreshed once pinned.
  - package-ecosystem: "pip"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Keeps the digest-pinned base image in .clusterfuzzlite/Dockerfile current. A pinned
  # digest with nothing updating it silently rots onto an unpatched base.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
